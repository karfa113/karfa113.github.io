html,body{height:100%}

.code{font-family:var(--serif);font-size:clamp(120px,min(30vw,34vh),360px);line-height:.8;letter-spacing:-.03em;position:relative}
.code i{font-style:italic;display:inline-block;animation:wob 5s ease-in-out infinite;transform-origin:50% 80%}

.btn{display:inline-flex;align-items:center;gap:10px;background:var(--neutral);color:var(--primary);text-decoration:none;font-weight:500;font-size:16px;padding:16px 26px;border-radius:999px;transition:background .25s,color .25s,box-shadow .25s}
.btn svg{width:16px;height:16px;transition:transform .25s}
.btn:hover{background:var(--secondary);color:var(--neutral);box-shadow:0 0 0 2px var(--neutral)}
.btn:hover svg{transform:translateX(-4px)}
.btn:focus-visible{outline:3px solid var(--neutral);outline-offset:3px}
footer{font-size:13px;opacity:.6;border-top:1px solid rgba(11,11,12,.2);padding-top:16px}
@media (prefers-reduced-motion:reduce){.code i{animation:none}.btn,.btn svg{transition:none}}
